<!DOCTYPE html>
<html lang="en">
    <head>
        <title>DoctorForm</title>
    </head>
    <body>
        <h1>This is a Doctor Form</h1>
        <p>This is doctor form yay</p>
        <hr>
        <form>
            <fieldset>
                <legend>
                    personal details 
                </legend>
                <label>
                    enter name 
                </label>
                <br>
                <input type="text" placeholder="Enter name">
                <br>
                <br>
                <label>
                    password
                </label>
                <input type="password" placeholder="passworld">
                <br>
                <label>
                    date of birth
                </label>
                <input type="date">
                <br>
            </fieldset>
            <fieldset>
                <legend>
                    more things
                </legend>
                <label>
                    select doctor to meet
                </label>
                <select>
                    <option value="">selctdoctor</option>
                    <option value="doctor 1">doctor one</option>
                    <option value="doctor 2">doctor two</option>
                    <option value="doctor 55">doctor five five</option>
                </select>
                <br>
                <label>
                    symtoms?
                </label>
                <textarea rows="3" cols="30" placeholder="descrime symtoms?"></textarea>
                <br>
                <br>
                <label>
                    gender
                </label>
                <input type="radio" value="male">Male
                <br>
                <input type="radio" value="female">Female
                <br>
                <br>
                <label>
                    time slot
                </label>
                <input type="checkbox" value="monday"> monday
                <br>
                <input type="checkbox" value="wendsday"> wendsday
                <br>
                <input type="checkbox" value="sunday"> sunday
                <br>
                <input type="submit">
            </fieldset>
        </form>
    </body>
</html>
