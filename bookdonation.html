<!DOCTYPE html>
<html lang="en">
    <head>
        <title>DoctorForm</title>
    </head>
    <body>
        <h1>Book Donation </h1>
        <p>Donation of Books </p>
        <hr>
        <form>
            <fieldset>
                <legend>
                   Student details
                </legend>
                <label>
                    Student name
                </label>
                <br>
                <input type="text" placeholder="Student name">
                <br>
                <br>
                <label>
                    ID number
                </label>
                <input type="password" placeholder="your ID">
                <br>
                <label>
                    Date of summistion
                </label>
                <input type="date">
                <br>
            </fieldset>
            <fieldset>
                <legend>
                   Book
                </legend>
                <label>
                   WHat book genre
                </label>
                <select>
                    <option value="">Genre</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Mystery">Mystery</option>
                </select>
                <br>
                <label>
                    A bit about the book
                </label>
                <textarea rows="3" cols="30" placeholder="Write here"></textarea>
                <br>
                <br>
                <label>
                    Class
                </label>
                <input type="radio" value="5">5
                <br>
                <input type="radio" value="4">4
                <br>
                <br>
                <label>
                   When to give
                </label>
                <input type="checkbox" value="monday"> monday
                <br>
                <input type="checkbox" value="wendsday"> wendsday
                <br>
                <input type="checkbox" value="friday"> friday
                <br>
                <input type="submit">
            </fieldset>
        </form>
    </body>
</html>
